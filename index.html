<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>供应商培训平台 · 任务广场</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#2e7d32;--green-light:#43a047;--bg:#f0f2f5;--card-bg:#fff;--text:#222;--text-light:#666;--text-muted:#999;--border:#e0e0e0;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.06);--shadow-hover:0 8px 28px rgba(0,0,0,.14)}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.5}

/* 导航栏 */
.navbar{background:linear-gradient(135deg,var(--green),var(--green-light));color:#fff;padding:14px 28px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 12px rgba(0,0,0,.15);position:sticky;top:0;z-index:100}
.navbar .logo{font-size:19px;font-weight:700;display:flex;align-items:center;gap:10px;white-space:nowrap}
.navbar .logo-icon{width:34px;height:34px;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px}
.navbar .search{display:flex;align-items:center;gap:8px}
.navbar .search input{padding:9px 18px;border:none;border-radius:22px;width:300px;font-size:14px;outline:none;transition:width .3s}
.navbar .search input:focus{width:360px;box-shadow:0 0 0 3px rgba(255,255,255,.3)}

/* 容器 */
.container{max-width:1240px;margin:0 auto;padding:28px 24px}

/* 头部 */
.header{text-align:center;margin-bottom:28px}
.header h1{font-size:28px;color:var(--text);margin-bottom:6px}
.header h1 .num{color:var(--green);font-size:32px;font-weight:800}
.header .subtitle{color:var(--text-light);font-size:14px}

/* 分类筛选条 */
.filter-bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:28px}
.filter-chip{background:#fff;padding:6px 16px;border-radius:18px;font-size:13px;color:var(--text-light);cursor:pointer;transition:all .2s;border:2px solid transparent;box-shadow:var(--shadow);user-select:none}
.filter-chip:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover)}
.filter-chip.active{background:var(--green);color:#fff;border-color:var(--green)}
.filter-chip .count{font-size:11px;opacity:.7;margin-left:4px}

/* 分类区块 */
.section{margin-bottom:36px}
.section-header{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid var(--border)}
.section-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;flex-shrink:0}
.section-info{flex:1;min-width:0}
.section-title{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.section-title .badge-count{font-size:12px;font-weight:400;color:var(--text-muted);background:#f0f0f0;padding:2px 10px;border-radius:10px}
.section-desc{font-size:12px;color:var(--text-muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 卡片网格 */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{background:var(--card-bg);border-radius:var(--radius);padding:16px;cursor:pointer;transition:all .25s;border:2px solid transparent;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;width:4px;height:100%;background:var(--cat-color,#ccc);transition:width .25s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover);border-color:var(--cat-color,#ccc)}
.card:hover::before{width:6px}
.card .name{font-size:15px;font-weight:600;margin-bottom:6px;line-height:1.3;padding-left:6px}
.card .info{font-size:12px;color:var(--text-light);padding-left:6px;margin:3px 0}
.card .info .label{color:var(--text-muted)}
.card .play-hint{margin-top:8px;font-size:12px;color:var(--green);font-weight:500;padding-left:6px;display:flex;align-items:center;gap:4px}

/* 模态播放器 */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:9999;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal-overlay.active{display:flex}
.modal-box{background:#1a1a1a;border-radius:14px;padding:18px;max-width:92vw;max-height:92vh;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal-close{position:absolute;top:-16px;right:-16px;width:38px;height:38px;border-radius:50%;background:#fff;color:#333;border:none;font-size:20px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;transition:transform .2s;z-index:1}
.modal-close:hover{transform:scale(1.1) rotate(90deg)}
.modal-title{color:#fff;font-size:16px;margin-bottom:10px;text-align:center;max-width:640px;word-break:break-all;font-weight:600}
.modal-video{max-width:640px;max-height:480px;width:100%;display:block;background:#000;border-radius:8px}
.modal-links{margin-top:12px;text-align:center}
.modal-links a{color:#64b5f6;font-size:13px;text-decoration:none;margin:0 8px;padding:4px 12px;border:1px solid rgba(100,181,246,.3);border-radius:16px;transition:all .2s}
.modal-links a:hover{background:rgba(100,181,246,.1)}

/* 空结果 */
.empty{text-align:center;padding:60px 20px;color:var(--text-muted)}
.empty .icon{font-size:48px;margin-bottom:12px}

/* 响应式 */
@media(max-width:768px){
  .card-grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
  .navbar{padding:10px 14px}
  .navbar .search input{width:160px}
  .navbar .search input:focus{width:200px}
  .container{padding:20px 14px}
  .header h1{font-size:22px}
  .header h1 .num{font-size:26px}
  .section-title{font-size:16px}
  .modal-video{max-width:90vw;max-height:55vh}
}
</style>
</head>
<body>

<div class="navbar">
  <div class="logo"><span class="logo-icon">🎬</span> 供应商培训平台</div>
  <div class="search">
    <input id="searchInput" type="text" placeholder="🔍 输入场景名称搜索任务...">
  </div>
</div>

<div class="container">
  <div class="header">
    <h1>全部 <span class="num" id="totalCount">0</span> 个可拍任务</h1>
    <div class="subtitle">点击任务卡片查看示例视频</div>
  </div>

  <div class="filter-bar" id="filterBar"></div>
  <div id="sections"></div>

  <div class="empty" id="empty" style="display:none">
    <div class="icon">🔍</div>
    <div>没有找到匹配的任务</div>
  </div>
</div>

<!-- 模态播放器 -->
<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <button class="modal-close" id="modalClose">✕</button>
    <div class="modal-title" id="modalTitle"></div>
    <video id="modalVideo" class="modal-video" controls></video>
    <div class="modal-links" id="modalLinks"></div>
  </div>
</div>

<script>
// 分类定义
const CATS={
  retail:   {name:"商超零售",icon:"🛒",color:"#1565C2",desc:"过期下架、货物上架、整理货架、收银、卸货、称重等"},
  fresh:    {name:"生鲜处理",icon:"🥬",color:"#2E7D32",desc:"蔬菜分拣、挑选、上架、称重，菌菇分装称重"},
  pack:     {name:"包装作业",icon:"📦",color:"#6A1B9A",desc:"封口包装、粘贴封条、钱包包装与标签处理"},
  paper:    {name:"纸品加工",icon:"📄",color:"#5D4037",desc:"折叠杯套、纸袋穿绳"},
  shoes:    {name:"鞋业加工",icon:"👟",color:"#E65100",desc:"鞋后跟修毛边、鞋底刷胶、去杂质"},
  model:    {name:"模型加工",icon:"🌿",color:"#00695C",desc:"植被模型捆扎、品检、上胶、拼接、组装"},
  jewelry:  {name:"饰品加工",icon:"💍",color:"#AD1457",desc:"龙虾扣、铜牌、夜光十字架、手链、发卡"},
  craft:    {name:"手工布艺",icon:"🧵",color:"#F57F17",desc:"蝴蝶结、小兔帽花、布艺花、福袋香包、卷烟纸"},
  electron: {name:"电子组装",icon:"🔌",color:"#283593",desc:"对讲机、制冷风扇、马达点锡、按摩器、电子钟"},
  toy:      {name:"玩具组装",icon:"🧸",color:"#558B2F",desc:"小乌龟、方程式赛车、电脑支架、假婴"},
  lamp:     {name:"灯饰加工",icon:"🏮",color:"#F9A825",desc:"莲花灯折叠、拼装、撑开底座"},
  hardware: {name:"五金塑胶",icon:"⚙️",color:"#455A64",desc:"五金扣件、塑料配件、手机支架"},
  battery:  {name:"电池组装",icon:"🔋",color:"#BF360C",desc:"铅酸蓄电槽弹簧环与负极贴片安装"}
};

const TASKS=[
  {cat:"retail",title:"超市-过期商品下架",material:"过期商品、超市货架"},
  {cat:"retail",title:"超市-货物摆放上架",material:"商品、超市货架"},
  {cat:"retail",title:"超市-整理货架",material:"超市货架、清洁工具"},
  {cat:"retail",title:"收银",material:"收银台、商品"},
  {cat:"retail",title:"卸货",material:"货物、周转箱、托盘"},
  {cat:"retail",title:"散笔上架",material:"散笔、货架"},
  {cat:"retail",title:"套网套-水果",material:"水果、保护网套"},
  {cat:"retail",title:"物品称重",material:"物品、电子秤"},

  {cat:"fresh",title:"蔬菜分拣",material:"新鲜蔬菜、分拣框"},
  {cat:"fresh",title:"蔬菜分挑选",material:"待挑选蔬菜、挑选台"},
  {cat:"fresh",title:"蔬菜上架",material:"蔬菜、超市蔬菜货架"},
  {cat:"fresh",title:"蔬菜称重",material:"蔬菜、电子秤"},
  {cat:"fresh",title:"分装菌菇干",material:"菌菇干、分装包装袋"},
  {cat:"fresh",title:"称重菌菇干",material:"菌菇干、电子秤"},

  {cat:"pack",title:"封口包装",material:"包装袋、待封物品"},
  {cat:"pack",title:"粘贴封条",material:"封条、待封包装件"},
  {cat:"pack",title:"包装成品-钱包",material:"成品钱包、包装材料"},
  {cat:"pack",title:"拆除标签定孔-钱包卡片",material:"钱包卡片、标签拆除工具"},

  {cat:"paper",title:"纸品厂‑折叠杯套",material:"杯套片材"},
  {cat:"paper",title:"纸品厂‑纸袋穿绳",material:"纸袋、绳子"},

  {cat:"shoes",title:"鞋厂-鞋后跟片修理毛边",material:"鞋后跟片、修毛边工具"},
  {cat:"shoes",title:"鞋底前脚掌刷胶",material:"鞋底、胶料"},
  {cat:"shoes",title:"鞋后跟去杂质-足球鞋后跟",material:"足球鞋后跟、去杂质工具"},

  {cat:"model",title:"捆扎模具-植被模型",material:"植被模型模具、捆扎工具"},
  {cat:"model",title:"品检树干-植被模型",material:"树干配件、检测工具"},
  {cat:"model",title:"上胶树干-植被模型",material:"树干配件、胶料"},
  {cat:"model",title:"拼接果实-植被模型",material:"果实配件"},
  {cat:"model",title:"组装植被-植被模型",material:"植被模型配件"},
  {cat:"model",title:"质检花枝底垫-检测漏胶",material:"花枝底垫、检测工具"},

  {cat:"jewelry",title:"开合挂圈--饰品龙虾扣",material:"饰品龙虾扣"},
  {cat:"jewelry",title:"组装配件-铜牌饰品",material:"铜牌饰品配件"},
  {cat:"jewelry",title:"组装配件-夜光十字架",material:"夜光十字架配件"},
  {cat:"jewelry",title:"穿线手链-文玩手链",material:"手链线材、配件"},
  {cat:"jewelry",title:"拼接底托-发卡底托",material:"发卡底托配件"},
  {cat:"jewelry",title:"上胶底托-发卡底托",material:"发卡底托、胶料"},

  {cat:"craft",title:"折出蝴蝶结-蝴蝶结礼带",material:"蝴蝶结礼带丝带"},
  {cat:"craft",title:"粘贴饰品布标-小兔帽花",material:"小兔帽花、饰品布标"},
  {cat:"craft",title:"捆绑固定耳朵-小兔帽花",material:"小兔帽花、耳朵配件"},
  {cat:"craft",title:"打胶配饰-布艺花",material:"布艺花配件、胶料"},
  {cat:"craft",title:"手工厂-卷烟纸",material:"卷烟纸原材料"},
  {cat:"craft",title:"手工坊-记针存线",material:"针线工具、记录用品"},
  {cat:"craft",title:"编打福袋结-小福袋香包",material:"福袋香包、绳子"},
  {cat:"craft",title:"熔合福袋头与福袋结-小福袋香包",material:"福袋头、福袋结、熔合工具"},

  {cat:"electron",title:"对讲机背夹组装",material:"对讲机、背夹配件"},
  {cat:"electron",title:"外壳组装-制冷风扇",material:"制冷风扇外壳配件"},
  {cat:"electron",title:"蒸汽小火车-马达点锡",material:"马达、点锡工具"},
  {cat:"electron",title:"小腿按摩器内芯组装",material:"按摩器内芯配件"},
  {cat:"electron",title:"合盖电子钟",material:"电子钟配件"},
  {cat:"electron",title:"剥开耳机薄膜-耳机配件",material:"耳机配件、薄膜剥开工具"},

  {cat:"toy",title:"玩具厂-组装小乌龟",material:"小乌龟玩具配件"},
  {cat:"toy",title:"顶部外壳安装-方程式赛车",material:"方程式赛车、外壳配件"},
  {cat:"toy",title:"成品组装-电脑支架",material:"电脑支架配件"},
  {cat:"toy",title:"洗护婴身-假婴身体",material:"假婴身体、洗护用品"},
  {cat:"toy",title:"穿假婴裤子-假婴裤子",material:"假婴裤子、假婴模型"},

  {cat:"lamp",title:"折叠莲花片-莲花灯",material:"莲花灯莲花片"},
  {cat:"lamp",title:"拼装莲花底座-莲花灯",material:"莲花灯底座零件"},
  {cat:"lamp",title:"撑开莲花底座-莲花灯",material:"莲花灯底座"},

  {cat:"hardware",title:"固定配装纽扣-五金扣件",material:"五金扣件纽扣"},
  {cat:"hardware",title:"套环塑料棒-塑料配件",material:"塑料棒、塑料配件"},
  {cat:"hardware",title:"粘贴防滑膜-手机支架",material:"手机支架、防滑膜"},

  {cat:"battery",title:"安装弹簧环-铅酸蓄电槽",material:"铅酸蓄电槽、弹簧环"},
  {cat:"battery",title:"安装负极贴片-铅酸蓄电槽",material:"铅酸蓄电槽、负极贴片"}
];

// 当前筛选
let activeFilter="all";

// 渲染分类筛选条
function renderFilterBar(){
  const bar=document.getElementById("filterBar");
  let html=`<div class="filter-chip ${activeFilter==='all'?'active':''}" data-cat="all">全部 <span class="count">${TASKS.length}</span></div>`;
  for(const [key,cat] of Object.entries(CATS)){
    const count=TASKS.filter(t=>t.cat===key).length;
    if(count===0) continue;
    html+=`<div class="filter-chip ${activeFilter===key?'active':''}" data-cat="${key}">${cat.icon} ${cat.name} <span class="count">${count}</span></div>`;
  }
  bar.innerHTML=html;
  bar.querySelectorAll(".filter-chip").forEach(chip=>{
    chip.addEventListener("click",()=>{
      activeFilter=chip.dataset.cat;
      renderFilterBar();
      renderSections(document.getElementById("searchInput").value);
    });
  });
}

// 渲染分类区块
function renderSections(filter=""){
  const f=filter.trim().toLowerCase();
  const container=document.getElementById("sections");
  container.innerHTML="";
  let total=0;

  for(const [key,cat] of Object.entries(CATS)){
    if(activeFilter!=="all" && activeFilter!==key) continue;
    let tasks=TASKS.filter(t=>t.cat===key);
    if(f) tasks=tasks.filter(t=>t.title.toLowerCase().includes(f)||t.material.toLowerCase().includes(f));
    if(tasks.length===0) continue;
    total+=tasks.length;

    const section=document.createElement("div");
    section.className="section";
    section.innerHTML=`
      <div class="section-header">
        <div class="section-icon" style="background:${cat.color}">${cat.icon}</div>
        <div class="section-info">
          <div class="section-title">${cat.name}<span class="badge-count">${tasks.length} 个任务</span></div>
          <div class="section-desc">${cat.desc}</div>
        </div>
      </div>
      <div class="card-grid"></div>`;
    const grid=section.querySelector(".card-grid");
    tasks.forEach(t=>{
      const card=document.createElement("div");
      card.className="card";
      card.style.setProperty("--cat-color",cat.color);
      card.innerHTML=`
        <div class="name">${t.title}</div>
        <div class="info"><span class="label">📦 物料：</span>${t.material}</div>
        <div class="play-hint">▶ 点击查看示例视频</div>`;
      card.addEventListener("click",()=>openModal(t));
      grid.appendChild(card);
    });
    container.appendChild(section);
  }

  document.getElementById("totalCount").textContent=total;
  document.getElementById("empty").style.display=total===0?"block":"none";
}

// 模态播放器
const modal=document.getElementById("modal");
const modalVideo=document.getElementById("modalVideo");
const modalTitle=document.getElementById("modalTitle");
const modalLinks=document.getElementById("modalLinks");

function openModal(task){
  modalTitle.textContent=task.title;
  const srcMp4="./"+task.title+".mp4";
  const srcMP4="./"+task.title+".MP4";
  modalLinks.innerHTML="";
  modal.classList.add("active");
  modalVideo.src=srcMp4;
  modalVideo.load();
  const tryAlt=()=>{
    if(modalVideo.src.endsWith(".mp4")){
      modalVideo.src=srcMP4;
      modalVideo.load();
      modalVideo.play().catch(()=>{});
    }else{
      modalLinks.innerHTML=`<a href="${srcMp4}" target="_blank">🔗 下载 .mp4</a><a href="${srcMP4}" target="_blank">🔗 下载 .MP4</a>`;
    }
  };
  modalVideo.play().catch(()=>{tryAlt();});
  modalVideo.onerror=tryAlt;
}

function closeModal(){
  modal.classList.remove("active");
  modalVideo.pause();
  modalVideo.removeAttribute("src");
  modalVideo.load();
}

document.getElementById("modalClose").addEventListener("click",closeModal);
modal.addEventListener("click",e=>{if(e.target===modal)closeModal();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&modal.classList.contains("active"))closeModal();});

// 搜索
document.getElementById("searchInput").addEventListener("input",e=>{renderSections(e.target.value);});

// 初始化
renderFilterBar();
renderSections();
</script>
</body>
</html>
